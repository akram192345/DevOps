# Continuous integration: every pull request into main runs this before it can
# be merged. Branch protection makes the "quality-gate" job a required check,
# so nothing reaches trunk without passing it.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: flake8 (style and simple defects)
        run: flake8 app tests
      - name: bandit (SAST - shift-left security)
        run: bandit -r app -ll

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      # pytest.ini sets --cov-fail-under=80, so low coverage fails the build.
      - name: pytest with coverage gate
        run: pytest --junitxml=junit.xml
      - name: Publish test evidence (retained for audit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit.xml
          retention-days: 90

  build-image:
    name: Build and scan container image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Derive version from tag or commit
        id: ver
        run: echo "value=${GITHUB_REF_NAME#v}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.ver.outputs.value }} \
            -t fintech-ledger-api:${{ steps.ver.outputs.value }} .
      # Gate on CRITICAL only, and ignore findings with no available fix.
      # A gate that blocks on unfixable base-image CVEs cannot be satisfied,
      # so it would simply be switched off - a deliberate triage decision,
      # not a relaxation. HIGH and below are reported to the backlog.
      - name: Vulnerability scan (blocks on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: fintech-ledger-api:${{ steps.ver.outputs.value }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy.sarif
      # Code scanning upload requires a public repo (or Advanced Security),
      # so this records evidence where available but never gates the build.
      - name: Upload scan results as compliance evidence
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      - name: Retain scan report as a downloadable artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan
          path: trivy.sarif
          retention-days: 90
      - name: Smoke test the built image
        run: |
          docker run -d --name smoke -p 8000:8000 \
            fintech-ledger-api:${{ steps.ver.outputs.value }}
          for i in $(seq 1 20); do
            curl -fs http://localhost:8000/healthz && break || sleep 2
          done
          curl -fs http://localhost:8000/healthz | grep -q '"status":"ok"'
          docker rm -f smoke

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [lint, test, build-image]
    steps:
      - name: All checks green
        run: echo "Build, tests, coverage and security scans passed - merge permitted."
