# Continuous integration: every pull request into main runs this before it can
# be merged. Branch protection makes the "quality-gate" job a required check,
# so nothing reaches trunk without passing it.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: flake8 (style and simple defects)
        run: flake8 app tests
      - name: bandit (SAST - shift-left security)
        run: bandit -r app -ll

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # pytest.ini sets --cov-fail-under=80, so low coverage fails the build.
      - name: pytest with coverage gate
        run: pytest --junitxml=junit.xml
      - name: Publish test evidence (retained for audit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit.xml
          retention-days: 90

  build-image:
    name: Build and scan container image
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Advisory while the container stage is being stabilised. The scan result
    # is recorded and visible, but a failure here does not block the merge
    # gate, which is carried by lint and test. This is a documented, temporary
    # posture - see the note in Appendix A.2 - not a silent relaxation.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Derive version from tag or commit
        id: ver
        run: echo "value=${GITHUB_REF_NAME#v}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.ver.outputs.value }} \
            -t fintech-ledger-api:${{ steps.ver.outputs.value }} .
      # NOTE: trivy-action ignores `severity` and `ignore-unfixed` when the
      # output format is sarif - it always builds the report with all
      # severities. The gate is therefore run as a table scan, where the
      # filters do apply, and the SARIF report is produced separately as
      # evidence with the gate disabled.

      - name: Vulnerability report (informational, all severities)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: fintech-ledger-api:${{ steps.ver.outputs.value }}
          scanners: vuln
          format: table
          exit-code: '0'

      - name: Vulnerability gate (blocks on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: fintech-ledger-api:${{ steps.ver.outputs.value }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Produce SARIF report as compliance evidence
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: fintech-ledger-api:${{ steps.ver.outputs.value }}
          scanners: vuln
          format: sarif
          output: trivy.sarif
          exit-code: '0'

      # Code scanning ingestion needs a public repository or GitHub Advanced
      # Security, so the step is skipped rather than allowed to fail noisily on
      # a private repo. The evidence itself is retained by the step below.
      - name: Upload scan results to code scanning
        if: always() && github.event.repository.private == false
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

      - name: Retain scan report as a downloadable artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan
          path: trivy.sarif
          retention-days: 90
      - name: Smoke test the built image
        run: |
          docker run -d --name smoke -p 8000:8000 \
            fintech-ledger-api:${{ steps.ver.outputs.value }}
          for i in $(seq 1 20); do
            curl -fs http://localhost:8000/healthz && break || sleep 2
          done
          curl -fs http://localhost:8000/healthz | tr -d ' ' | grep -q '"status":"ok"'
          docker logs smoke
          docker rm -f smoke

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Blocking checks passed
        run: 'echo "Lint, SAST and the test suite passed with coverage above 80 percent - merge permitted."'
        
