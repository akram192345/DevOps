[pytest]
testpaths = tests
# Put the repository root on sys.path so `import app` resolves whether pytest
# is invoked as `pytest` or as `python -m pytest`. Without this the two forms
# behave differently, which is precisely the kind of environment divergence
# the pipeline exists to eliminate.
pythonpath = .
addopts = -q --cov=app --cov-report=term-missing --cov-fail-under=80
